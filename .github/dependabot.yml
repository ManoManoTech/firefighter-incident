---
version: 2

# All version updates (GitHub Actions + npm) land in a single weekly pull request.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    # Security updates are not scheduled: batch them in one pull request
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
    # Security updates are not scheduled: batch them in one pull request
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
